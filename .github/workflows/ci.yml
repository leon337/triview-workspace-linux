name: CI

on:
  pull_request:
  push:
    branches: [main, "train/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Install X11 integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth xdotool xinput xserver-xephyr x11-utils
      - name: Compile
        run: python -m compileall -q src tests
      - name: Tests
        run: pytest --junitxml=pytest-results.xml
      - name: X11 wheel integration
        run: |
          xvfb-run -a env TRIVIEW_RUN_X11_INTEGRATION=1 \
            pytest -q \
              tests/test_browser_wheel_x11_integration.py \
              tests/test_xtest_blackbox.py
      - name: Xephyr containment integration
        run: |
          xvfb-run -a env TRIVIEW_RUN_XEPHYR_INTEGRATION=1 \
            pytest -q tests/test_browser_xephyr_x11_integration.py
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: error

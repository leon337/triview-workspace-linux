name: Reconcile main inspection

on:
  push:
    branches:
      - release/reconcile-main-1.0.0a1

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect frozen reconciliation
        id: inspect
        shell: bash
        run: |
          set -Eeuo pipefail
          TRAIN_SHA="8926e6a01c69e84a96b418ffefb934bb74288118"
          MAIN_SHA="77c8f3fb51966b33dd47f0aaa3b4511492125f7c"

          git fetch origin main train/road-to-1.0
          test "$(git rev-parse origin/train/road-to-1.0)" = "$TRAIN_SHA"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"

          git reset --hard "$TRAIN_SHA"
          git config user.name "TriView Release Bot"
          git config user.email "actions@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff "$MAIN_SHA"
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          {
            echo '## Inventário automático da reconciliação'
            echo
            echo "- train: \`$TRAIN_SHA\`"
            echo "- main: \`$MAIN_SHA\`"
            echo "- merge_status: \`$merge_status\`"
            echo
            echo '### Arquivos em conflito'
            echo
            echo '```text'
            if [[ -n "$conflicts" ]]; then
              printf '%s\n' "$conflicts"
            else
              echo '(nenhum)'
            fi
            echo '```'
            echo
            echo '### Estado completo'
            echo
            echo '```text'
            git status --short
            echo '```'
          } > /tmp/reconciliation-report.md

          cat /tmp/reconciliation-report.md
          echo "merge_status=$merge_status" >> "$GITHUB_OUTPUT"
      - name: Publish inventory on PR #52
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 52 --repo "$GITHUB_REPOSITORY" --body-file /tmp/reconciliation-report.md
      - name: Fail while conflicts remain
        if: steps.inspect.outputs.merge_status != '0'
        run: exit 1

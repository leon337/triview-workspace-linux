name: Diagnose main reconciliation

on:
  push:
    branches:
      - release/reconcile-main-1.0.0a1

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile and record every gate
        id: reconcile
        shell: bash
        run: |
          set -uo pipefail
          TRAIN_SHA="8926e6a01c69e84a96b418ffefb934bb74288118"
          MAIN_SHA="77c8f3fb51966b33dd47f0aaa3b4511492125f7c"
          report=/tmp/reconcile-diagnostic.md
          overall=0

          {
            echo '## Diagnóstico da resolução de conflitos'
            echo
            echo '```text'
          } > "$report"

          run_gate() {
            local name="$1"
            shift
            "$@" >> "$report" 2>&1
            local status=$?
            printf '%s=%s\n' "$name" "$status" >> "$report"
            if ((status != 0)); then overall=1; fi
            return 0
          }

          run_gate fetch git fetch origin main train/road-to-1.0
          run_gate verify_train test "$(git rev-parse origin/train/road-to-1.0 2>/dev/null)" = "$TRAIN_SHA"
          run_gate verify_main test "$(git rev-parse origin/main 2>/dev/null)" = "$MAIN_SHA"
          run_gate reset git reset --hard "$TRAIN_SHA"

          git config user.name "TriView Release Bot"
          git config user.email "actions@users.noreply.github.com"

          git merge --no-commit --no-ff "$MAIN_SHA" >> "$report" 2>&1
          merge_status=$?
          echo "merge_status=$merge_status" >> "$report"

          actual_conflicts="$(git diff --name-only --diff-filter=U | sort)"
          echo 'conflicts_begin' >> "$report"
          printf '%s\n' "$actual_conflicts" >> "$report"
          echo 'conflicts_end' >> "$report"

          expected_conflicts="CHANGELOG.md
README.md
docs/updater.md
pyproject.toml
src/triview_workspace/__init__.py"
          if [[ "$actual_conflicts" == "$expected_conflicts" ]]; then
            echo 'conflict_inventory=0' >> "$report"
          else
            echo 'conflict_inventory=1' >> "$report"
            overall=1
          fi

          git checkout --ours -- \
            CHANGELOG.md \
            README.md \
            docs/updater.md \
            pyproject.toml \
            src/triview_workspace/__init__.py >> "$report" 2>&1
          checkout_status=$?
          echo "checkout_ours=$checkout_status" >> "$report"
          ((checkout_status == 0)) || overall=1

          git add \
            CHANGELOG.md \
            README.md \
            docs/updater.md \
            pyproject.toml \
            src/triview_workspace/__init__.py >> "$report" 2>&1
          add_status=$?
          echo "add_resolution=$add_status" >> "$report"
          ((add_status == 0)) || overall=1

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [[ -z "$unresolved" ]]; then
            echo 'unresolved=0' >> "$report"
          else
            echo 'unresolved=1' >> "$report"
            printf '%s\n' "$unresolved" >> "$report"
            overall=1
          fi

          for path in \
            .github/workflows/publish-bootstrap-release.yml \
            config/update-channels/testing.json \
            tests/test_update_channel.py; do
            if [[ -f "$path" ]]; then
              echo "present:$path=0" >> "$report"
            else
              echo "present:$path=1" >> "$report"
              overall=1
            fi
          done

          bash -n scripts/update.sh >> "$report" 2>&1
          echo "update_syntax=$?" >> "$report"
          grep -q 'version = "1.0.0a1"' pyproject.toml
          echo "pyproject_version=$?" >> "$report"
          grep -q '__version__ = "1.0.0a1"' src/triview_workspace/__init__.py
          echo "package_version=$?" >> "$report"

          echo 'status_begin' >> "$report"
          git status --short >> "$report" 2>&1
          echo 'status_end' >> "$report"
          echo "overall=$overall" >> "$report"
          echo '```' >> "$report"

          cat "$report"
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
      - name: Publish diagnostic on PR #52
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 52 --repo "$GITHUB_REPOSITORY" --body-file /tmp/reconcile-diagnostic.md
      - name: Preserve failure signal
        if: steps.reconcile.outputs.overall != '0'
        run: exit 1

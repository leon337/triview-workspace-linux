name: CI

on:
  pull_request:
  push:
    branches: [main, "train/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Install X11 integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth xdotool xinput xserver-xephyr x11-utils
      - name: Compile
        run: python -m compileall -q src tests
      - name: Tests
        run: pytest --junitxml=pytest-results.xml
      - name: X11 wheel integration
        run: |
          xvfb-run -a env TRIVIEW_RUN_X11_INTEGRATION=1 \
            pytest -q tests/test_browser_wheel_x11_integration.py
      - name: XTEST device integration
        run: |
          xvfb-run -a bash -lc '
            xinput list --short | tee /tmp/triview-xinput-list.txt
            grep -qi "XTEST pointer" /tmp/triview-xinput-list.txt
            grep -qi "XTEST keyboard" /tmp/triview-xinput-list.txt
          '
      - name: Xephyr containment integration
        run: |
          xvfb-run -a env TRIVIEW_RUN_XEPHYR_INTEGRATION=1 \
            pytest -q tests/test_browser_xephyr_x11_integration.py
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: error

  reconcile_main:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/reconcile-main-1.0.0a1'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build deterministic reconciled tree
        shell: bash
        run: |
          set -Eeuo pipefail
          TRAIN_SHA="8926e6a01c69e84a96b418ffefb934bb74288118"
          MAIN_SHA="77c8f3fb51966b33dd47f0aaa3b4511492125f7c"
          BRANCH="release/reconcile-main-1.0.0a1"

          git fetch origin main train/road-to-1.0 "$BRANCH"
          git merge-base --is-ancestor "$TRAIN_SHA" origin/train/road-to-1.0
          train_delta="$(git diff --name-only "$TRAIN_SHA"..origin/train/road-to-1.0 | sort)"
          expected_train_delta="$(cat <<'EOF'
.github/workflows/ci.yml
.github/workflows/reconcile-main.yml
EOF
)"
          test "$train_delta" = "$expected_train_delta"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          EXPECTED_REMOTE_SHA="$(git rev-parse "origin/$BRANCH")"
          printf '%s\n' "$EXPECTED_REMOTE_SHA" > /tmp/expected-remote-sha

          git reset --hard "$TRAIN_SHA"
          git config user.name "TriView Release Bot"
          git config user.email "actions@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff "$MAIN_SHA"
          merge_status=$?
          set -e
          test "$merge_status" -eq 1

          expected_conflicts="$(cat <<'EOF'
CHANGELOG.md
README.md
docs/updater.md
pyproject.toml
src/triview_workspace/__init__.py
EOF
)"
          actual_conflicts="$(git diff --name-only --diff-filter=U | sort)"
          test "$actual_conflicts" = "$expected_conflicts"

          git checkout --ours -- \
            CHANGELOG.md \
            README.md \
            docs/updater.md \
            pyproject.toml \
            src/triview_workspace/__init__.py
          git add \
            CHANGELOG.md \
            README.md \
            docs/updater.md \
            pyproject.toml \
            src/triview_workspace/__init__.py

          test -z "$(git diff --name-only --diff-filter=U)"
          test -f .github/workflows/publish-bootstrap-release.yml
          test -f config/update-channels/testing.json
          test -f tests/test_update_channel.py
          bash -n scripts/update.sh
          grep -q 'version = "1.0.0a1"' pyproject.toml
          grep -q '__version__ = "1.0.0a1"' src/triview_workspace/__init__.py
          git status --short
      - name: Install merged-tree dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth xdotool xinput xserver-xephyr x11-utils
      - name: Compile reconciled tree
        run: python -m compileall -q src tests
      - name: Test reconciled tree
        run: pytest --junitxml=reconciliation-pytest-results.xml
      - name: X11 wheel on reconciled tree
        run: |
          xvfb-run -a env TRIVIEW_RUN_X11_INTEGRATION=1 \
            pytest -q tests/test_browser_wheel_x11_integration.py
      - name: XTEST devices on reconciled tree
        run: |
          xvfb-run -a bash -lc '
            xinput list --short | tee /tmp/triview-xinput-list.txt
            grep -qi "XTEST pointer" /tmp/triview-xinput-list.txt
            grep -qi "XTEST keyboard" /tmp/triview-xinput-list.txt
          '
      - name: Xephyr containment on reconciled tree
        run: |
          xvfb-run -a env TRIVIEW_RUN_XEPHYR_INTEGRATION=1 \
            pytest -q tests/test_browser_xephyr_x11_integration.py
      - name: Publish reconciled branch
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          BRANCH="release/reconcile-main-1.0.0a1"
          EXPECTED_REMOTE_SHA="$(cat /tmp/expected-remote-sha)"
          git commit -m "release: reconcile accepted train with main updater hotfixes"
          MERGE_SHA="$(git rev-parse HEAD)"
          git push \
            --force-with-lease="refs/heads/$BRANCH:$EXPECTED_REMOTE_SHA" \
            origin "HEAD:refs/heads/$BRANCH"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
      - name: Report reconciliation on PR #52
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.publish.outputs.merge_sha }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          cat > /tmp/reconciliation-result.md <<EOF
          ## Resultado automático da reconciliação

          - publicação da branch: \`$PUBLISH_OUTCOME\`;
          - merge commit: \`${MERGE_SHA:-não gerado}\`;
          - train funcional: \`8926e6a01c69e84a96b418ffefb934bb74288118\`;
          - main preservada: \`77c8f3fb51966b33dd47f0aaa3b4511492125f7c\`.

          A branch só é publicada depois de suíte completa, X11, XTEST e Xephyr em PASS.
          EOF
          gh pr comment 52 --repo "$GITHUB_REPOSITORY" --body-file /tmp/reconciliation-result.md
      - name: Upload reconciled test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-pytest-results
          path: reconciliation-pytest-results.xml
          if-no-files-found: warn

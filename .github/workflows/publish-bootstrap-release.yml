name: Publish stable release

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "scripts/update.sh"
      - "scripts/update-core.sh"
      - ".github/workflows/publish-bootstrap-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Install X11 integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth xdotool xinput xserver-xephyr x11-utils
      - name: Compile
        run: python -m compileall -q src tests
      - name: Validate shell scripts
        run: bash -n scripts/*.sh packaging/*.sh
      - name: Tests
        run: pytest --junitxml=release-pytest-results.xml
      - name: X11 wheel integration
        run: |
          xvfb-run -a env TRIVIEW_RUN_X11_INTEGRATION=1 \
            pytest -q tests/test_browser_wheel_x11_integration.py
      - name: XTEST device integration
        run: |
          xvfb-run -a bash -lc '
            xinput list --short | tee /tmp/triview-xinput-list.txt
            grep -qi "XTEST pointer" /tmp/triview-xinput-list.txt
            grep -qi "XTEST keyboard" /tmp/triview-xinput-list.txt
          '
      - name: Xephyr containment integration
        run: |
          xvfb-run -a env TRIVIEW_RUN_XEPHYR_INTEGRATION=1 \
            pytest -q tests/test_browser_xephyr_x11_integration.py
      - name: Upload release verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-pytest-results
          path: release-pytest-results.xml
          if-no-files-found: error

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="$(python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('pyproject.toml').read_text(encoding='utf-8')
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
          if not match:
              raise SystemExit('version not found')
          print(match.group(1))
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Publish release when absent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "TriView Workspace $VERSION" \
            --notes "Versão aprovada do TriView Workspace. Inclui workspaces vivos, navegadores incorporados via Xephyr, diagnóstico caixa-preta sanitizado e atualização estável com backup e rollback."
